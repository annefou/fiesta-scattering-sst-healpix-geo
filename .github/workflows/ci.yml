name: CI smoke run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    env:
      CI_MODE: "1"
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: fiesta-sst-healpix
          init-shell: bash
          cache-environment: true

      # Copernicus Marine auth is handled by the job-level env vars above
      # (COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD), which copernicusmarine
      # 2.x reads directly. No credentials file is needed — the previous step
      # here wrote a base64-encoded (i.e. unreadable) ~/.copernicusmarine file.

      - name: Run experiment
        shell: micromamba-shell {0}
        run: |
          jupytext --to notebook 01_sphere_vs_wgs84.py
          jupyter execute --inplace 01_sphere_vs_wgs84.ipynb

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            results/comparison_results.json
            results/comparison_rmse.png
            01_sphere_vs_wgs84.ipynb

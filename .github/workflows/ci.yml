name: CI smoke run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    env:
      # CI is hermetic: in CI_MODE the notebook uses a deterministic synthetic
      # SST field instead of downloading from Copernicus Marine, so the smoke
      # test needs no credentials and never depends on Copernicus auth uptime.
      CI_MODE: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: fiesta-sst-healpix
          init-shell: bash
          cache-environment: true

      - name: Run experiment
        shell: micromamba-shell {0}
        run: |
          jupytext --to notebook 01_sphere_vs_wgs84.py
          jupyter execute --inplace 01_sphere_vs_wgs84.ipynb

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            results/comparison_results.json
            results/comparison_rmse.png
            01_sphere_vs_wgs84.ipynb

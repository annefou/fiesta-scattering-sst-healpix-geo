name: Build and Deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: fiesta-sst-healpix
          init-shell: bash
          cache-environment: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install MyST
        run: npm install -g mystmd

      # Copernicus Marine auth is handled by the job-level env vars above
      # (COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD), which copernicusmarine
      # 2.x reads directly. No credentials file is needed — the previous step
      # here wrote a base64-encoded (i.e. unreadable) ~/.copernicusmarine file.

      # Cache the downloaded SST so re-runs don't re-hit Copernicus Marine.
      # Keyed on the notebook (which pins DATE) — a cache hit means the notebook
      # loads data/ locally and never calls copernicusmarine (no auth needed).
      - name: Cache Copernicus SST data
        uses: actions/cache@v4
        with:
          path: data
          key: sst-data-${{ hashFiles('01_sphere_vs_wgs84.py') }}

      - name: Execute notebook (retry transient Copernicus auth blips)
        shell: micromamba-shell {0}
        run: |
          jupytext --to notebook 01_sphere_vs_wgs84.py
          ok=0
          for attempt in 1 2 3; do
            if jupyter execute --inplace 01_sphere_vs_wgs84.ipynb; then ok=1; break; fi
            echo "::warning::notebook execution attempt $attempt failed (likely a transient Copernicus auth blip); retrying in 30s"
            sleep 30
          done
          [ "$ok" = 1 ] || { echo "::error::notebook execution failed after 3 attempts"; exit 1; }

      - name: Build MyST site
        shell: micromamba-shell {0}
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
